[package]
name = "dvdmanager"
version = "1.0.0"
edition = "2021"
description = "Verkleinert eigene, ungeschuetzte Video-DVDs auf Rohling-Groesse"

[lib]
name = "discslim"
path = "src/lib.rs"

[[bin]]
name = "dvdmanager"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui-pop-phosphor = "0.15"
rfd = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Media", "Win32_Media_MediaFoundation", "Win32_Media_Audio", "Win32_Media_Multimedia"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
